name: Build StrattV4 Push 1

on:
  workflow_dispatch:
  push:
    branches: [main, v4-foundation]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout StrattV4 and pinned upstream source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Verify pinned upstream revision
        run: |
          expected="013620c1330cdcf896e96ef8fdc8a2123e4fce6a"
          actual="$(git -C vendor/DrivenByMoss rev-parse HEAD)"
          test "$actual" = "$expected"

      - name: Repair stale nativefilechooser POM checksum in CI workspace
        run: |
          pom="vendor/DrivenByMoss/maven-local-repository/de/mossgrabers/nativefilechooser/1.3.1/nativefilechooser-1.3.1.pom"
          checksum="${pom}.sha1"
          expected_stale="681a3e092c24eee87603e5058b0baf616d704118"
          expected_actual="6728463afe1035bf871269c076c24d615acc683f"
          recorded="$(tr -d '[:space:]' < "$checksum")"
          actual="$(sha1sum "$pom" | awk '{print $1}')"
          test "$actual" = "$expected_actual"
          if [ "$recorded" != "$expected_stale" ] && [ "$recorded" != "$actual" ]; then
            echo "Unexpected nativefilechooser POM checksum: $recorded" >&2
            exit 1
          fi
          printf '%s' "$actual" > "$checksum"
          echo "Verified nativefilechooser POM SHA-1: $actual"

      - name: Install Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'

      - name: Keep Push 1 as the only registered controller
        run: |
          service_file="vendor/DrivenByMoss/src/main/resources/META-INF/services/com.bitwig.extension.ExtensionDefinition"
          test -f "$service_file"
          printf '%s' 'de.mossgrabers.bitwig.controller.ableton.push.Push1ControllerExtensionDefinition' > "$service_file"

      - name: Apply StrattV4 customizations transactionally
        run: python3 -B -u scripts/apply_push1_palette_transactional.py

      - name: Run MIDI lifecycle behavioral tests
        run: |
          test_dir="$(mktemp -d)"
          javac -d "$test_dir" \
            vendor/DrivenByMoss/src/main/java/de/mossgrabers/framework/view/PadMidiNoteTracker.java \
            vendor/DrivenByMoss/src/main/java/de/mossgrabers/controller/ableton/push/view/PadViewTaskGuard.java \
            tests/java/PadMidiNoteTrackerTest.java \
            tests/java/PadViewTaskGuardTest.java \
            vendor/DrivenByMoss/src/main/java/de/mossgrabers/framework/command/trigger/mode/KnobTouchOwner.java \
            tests/java/KnobTouchOwnerTest.java \
            vendor/DrivenByMoss/src/main/java/de/mossgrabers/framework/command/trigger/clip/Push1SelectGesture.java \
            tests/java/Push1SelectGestureTest.java \
            vendor/DrivenByMoss/src/main/java/de/mossgrabers/framework/mode/NoteEditTouchOwner.java \
            tests/java/NoteEditTouchOwnerTest.java
          java -cp "$test_dir" de.mossgrabers.controller.ableton.push.view.PadMidiNoteTrackerTest
          java -cp "$test_dir" de.mossgrabers.controller.ableton.push.view.PadViewTaskGuardTest
          java -cp "$test_dir" de.mossgrabers.framework.command.trigger.mode.KnobTouchOwnerTest
          java -cp "$test_dir" de.mossgrabers.framework.command.trigger.clip.Push1SelectGestureTest
          java -cp "$test_dir" de.mossgrabers.framework.mode.NoteEditTouchOwnerTest

      - name: Run Python regression suite
        run: python3 -B -m unittest discover -s tests -p 'test_*.py' -v

      - name: Build extension and verify Push 1 registration
        run: |
          cd vendor/DrivenByMoss
          mvn -B package
          test -f target/DrivenByMoss-19.2.2.jar
          registered="$(unzip -p target/DrivenByMoss-19.2.2.jar META-INF/services/com.bitwig.extension.ExtensionDefinition)"
          expected="de.mossgrabers.bitwig.controller.ableton.push.Push1ControllerExtensionDefinition"
          test "$registered" = "$expected"
          cp target/DrivenByMoss-19.2.2.jar ../../StrattV4.bwextension
          cd ../..
          unzip -t StrattV4.bwextension

      - name: Upload StrattV4 test extension
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: StrattV4-Push1-Test
          path: StrattV4.bwextension
          if-no-files-found: error
          retention-days: 7

      - name: Upload StrattV4 release candidate
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: StrattV4-Push1
          path: StrattV4.bwextension
          if-no-files-found: error
          retention-days: 30
